; PlatformIO config for the gate screen (F12): LilyGO T-Display-S3, USB powered, nothing wired to it.
; Onboard 170x320 ST7789 on the ESP32-S3 8-bit parallel bus; every frame is drawn into a full-screen
; Arduino_Canvas in the board's 8 MB OPI PSRAM and flushed at once (no flicker, no tearing).
[env:t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
; qio flash + opi PSRAM is what the T-Display-S3 ships with (16 MB flash, 8 MB OPI PSRAM). BOARD_HAS_PSRAM
; makes the Arduino core initialise the PSRAM at boot so heap_caps_aligned_alloc(MALLOC_CAP_SPIRAM) works.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
; Arduino_GFX 1.4.x is the last line that builds on arduino-esp32 core 2.0.x (what platform espressif32 ships).
; U8g2 is here only for its bitmap fonts: Arduino_GFX enables u8g2 font rendering when <U8g2lib.h> exists,
; and the linker keeps just the fonts main.cpp references (-fdata-sections / --gc-sections).
lib_deps =
  moononournation/GFX Library for Arduino@~1.4.9
  olikraus/U8g2@^2.36.10
