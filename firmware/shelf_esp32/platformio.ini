; PlatformIO config for the shelf controller (F12): LilyGO T-Display-S3 driving discrete LEDs
; and its onboard 170x320 ST7789 LCD (the store's gate display).
[env:t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
; Arduino_GFX 1.4.x is the last line that builds on arduino-esp32 core 2.0.x (what platform espressif32 ships).
lib_deps =
  moononournation/GFX Library for Arduino@~1.4.9
