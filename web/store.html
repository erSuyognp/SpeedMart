<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SpeedMart">
  <title>SpeedMart · Cart</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="has-action-bar">
  <main>
    <header class="topbar app-header">
      <h1>SpeedMart</h1>
      <span class="demo-badge" title="Demo store: a test card, no real money">DEMO</span>
      <div class="session-tag">
        <span id="session-id" class="mono"></span>
        <span id="live-dot" class="dot" title="Disconnected" aria-label="Disconnected"></span>
      </div>
      <!-- Demo bank (8.15): compact balance line, live over the socket. Filled by /js/bank.js. -->
      <div id="bank-mini" class="bank-mini" aria-live="polite" hidden></div>
    </header>

    <section id="loading" class="card">
      <div class="skeleton title"></div>
      <div class="skeleton-rows"><div class="skeleton row"></div><div class="skeleton row"></div></div>
    </section>

    <section id="outside" class="card notice" hidden>
      <h2 id="outside-title">You're not in the store</h2>
      <p id="outside-text" class="muted"></p>
      <div id="start-wrap" class="stack mt-4" hidden>
        <button id="start-btn" class="primary block">Start shopping</button>
      </div>
      <a id="receipt-link" class="button primary block mt-4" href="/receipt.html" hidden>View receipt</a>
    </section>

    <div id="shopping" class="stack" hidden>
      <section id="agent" class="card agent-card" aria-live="polite" hidden></section>

      <section id="warnings" class="strip warn" aria-live="polite" hidden></section>

      <section id="checkout-state" class="strip warn" hidden></section>

      <!-- Permissions card (8.10): collapsed here, tap to expand. Filled by /js/guardrails.js. -->
      <details id="guardrails" class="card disclosure guardrails" hidden></details>

      <!-- F18 entry point: the shopper describes a goal and the store plans it (web/intent.html). -->
      <a class="button secondary block" href="/intent.html">Tell us what you need</a>

      <section class="card stack" aria-labelledby="shelf-title">
        <h2 id="shelf-title">The shelf</h2>
        <div id="shelf-map"></div>
        <p id="find-note" class="muted small" style="margin:0" aria-live="polite" hidden></p>
      </section>

      <section class="card">
        <h2>Your cart</h2>
        <ul id="cart" class="cart-list"></ul>
        <p id="cart-empty" class="empty-cart">Nothing yet. Pick something off the shelf.</p>
      </section>

      <section class="card">
        <div class="totals">
          <span class="muted">Subtotal</span><span id="subtotal">$0.00</span>
          <span class="muted">Tax</span><span id="tax">$0.00</span>
          <span class="grand">Total</span><span id="total" class="grand">$0.00</span>
        </div>
        <div class="budget">
          <div class="budget-label"><span>Budget</span><span id="budget-text"></span></div>
          <div id="budget-bar" class="bar" role="progressbar" aria-label="Budget used"><span></span></div>
        </div>
      </section>

      <p id="exit-hint" class="hint" hidden>When you're done, scan the EXIT code.</p>

      <!-- Gates on: store.js hides #checkout-btn and the bar collapses (see .action-bar in app.css). -->
      <div class="action-bar">
        <button id="checkout-btn" class="primary" hidden>Checkout</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">Sandbox demo · no real payments</footer>

  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/bank.js"></script>
  <script src="/js/shelfmap.js"></script>
  <script src="/js/guardrails.js"></script>
  <script src="/js/dispute.js"></script>
  <script src="/js/pages/store.js"></script>
</body>
</html>
