<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <title>SpeedMart · Entrance</title>
  <!-- Shared tokens (--brand, --ok, --warn…) and the site reset. web/css/app.css does not exist in this
       repo; styles.css is the one stylesheet from Section 11. -->
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    /* Kiosk skin: Dell Venue 10" landscape (1280x800), readable from 2 metres, no scrolling, no touch UI.
       Deliberately self-contained so nothing here can shift the phone pages. */
    :root {
      --k-bg: #0d1017;
      --k-panel: #161a23;
      --k-line: #262c39;
      --k-text: #f4f6fa;
      --k-muted: #98a1b2;
      --k-ok: #2fbf62;
      --k-amber: #f0a92a;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--k-bg);
      color: var(--k-text);
      font-size: 16px;
    }

    body.kiosk {
      display: block;
      cursor: none;                       /* nothing on this screen is meant to be tapped */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* A very slow drift behind everything, so a parked kiosk still looks awake. */
    body.kiosk::before {
      content: "";
      position: fixed;
      inset: -30vmax;
      z-index: 0;
      background:
        radial-gradient(38vmax 38vmax at 28% 32%, rgba(26, 86, 219, 0.30), transparent 70%),
        radial-gradient(30vmax 30vmax at 74% 68%, rgba(47, 191, 98, 0.16), transparent 70%);
      animation: kiosk-drift 42s ease-in-out infinite alternate;
    }

    @keyframes kiosk-drift {
      from { transform: translate3d(-3vmax, -2vmax, 0) scale(1); }
      to   { transform: translate3d(3vmax, 2vmax, 0) scale(1.08); }
    }

    .kiosk-shell {
      position: relative;
      z-index: 1;
      height: 100vh;
      max-width: none;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: clamp(10px, 1.6vh, 22px);
      padding: clamp(14px, 2.2vh, 30px) clamp(20px, 3vw, 46px);
    }

    /* --- header --- */

    .kiosk-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .kiosk-store {
      font-size: clamp(30px, 4.4vh, 54px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .kiosk-tagline {
      margin-top: 6px;
      font-size: clamp(15px, 2vh, 23px);
      color: var(--k-muted);
    }

    .kiosk-clock {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .kiosk-time {
      font-size: clamp(34px, 5vh, 62px);
      font-weight: 700;
      line-height: 1;
    }

    .kiosk-date {
      margin-top: 6px;
      font-size: clamp(13px, 1.8vh, 20px);
      color: var(--k-muted);
    }

    /* --- status banner --- */

    .kiosk-status {
      display: flex;
      align-items: center;
      gap: clamp(12px, 1.6vw, 22px);
      padding: clamp(10px, 1.6vh, 20px) clamp(16px, 2vw, 28px);
      border: 2px solid var(--k-line);
      border-radius: 18px;
      background: var(--k-panel);
      font-size: clamp(22px, 3.4vh, 42px);
      font-weight: 700;
      transition: border-color 0.5s ease, color 0.5s ease;
    }

    .kiosk-status .lamp {
      width: clamp(18px, 2.4vh, 30px);
      height: clamp(18px, 2.4vh, 30px);
      border-radius: 50%;
      background: var(--k-muted);
      flex: none;
      animation: kiosk-pulse 3.4s ease-in-out infinite;
    }

    @keyframes kiosk-pulse {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.55; transform: scale(0.88); }
    }

    .kiosk-status.is-open       { border-color: var(--k-ok);    color: var(--k-ok); }
    .kiosk-status.is-open .lamp { background: var(--k-ok);      box-shadow: 0 0 22px rgba(47, 191, 98, 0.55); }
    .kiosk-status.is-busy       { border-color: var(--k-amber); color: var(--k-amber); }
    .kiosk-status.is-busy .lamp { background: var(--k-amber);   box-shadow: 0 0 22px rgba(240, 169, 42, 0.55); }
    .kiosk-status.is-offline    { border-color: var(--k-line);  color: var(--k-muted); }

    .kiosk-status-sub {
      margin-left: auto;
      font-size: clamp(13px, 1.8vh, 20px);
      font-weight: 500;
      color: var(--k-muted);
      text-align: right;
    }

    /* --- QR codes --- */

    .kiosk-codes {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(var(--kiosk-cols, 2), minmax(0, 1fr));
      gap: clamp(18px, 3vw, 44px);
      align-items: stretch;
      justify-items: center;
    }

    .kiosk-code {
      min-height: 0;
      width: 100%;
      max-width: 520px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(8px, 1.2vh, 16px);
      padding: clamp(12px, 1.8vh, 22px);
      border-radius: 20px;
      background: var(--k-panel);
      border: 1px solid var(--k-line);
      text-align: center;
      animation: kiosk-rise 0.7s ease both;
    }

    .kiosk-code:nth-child(2) { animation-delay: 0.12s; }

    @keyframes kiosk-rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .kiosk-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: clamp(18px, 2.6vh, 32px);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .kiosk-step .num {
      width: clamp(28px, 3.6vh, 46px);
      height: clamp(28px, 3.6vh, 46px);
      border-radius: 50%;
      background: var(--brand, #1a56db);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: clamp(16px, 2.2vh, 26px);
    }

    /* The image is taken out of flow so it can never push the caption off the bottom of a short
       screen: it fills whatever height the 1fr row ends up with, and stays square. */
    .kiosk-qr {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    /* White plate around the code: scanners need the quiet zone to stay white. */
    .kiosk-qr img {
      position: absolute;
      inset: 0;
      margin: auto;
      max-height: 100%;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      background: #fff;
      border-radius: 14px;
      padding: clamp(6px, 1vh, 12px);
      image-rendering: pixelated;         /* keep module edges crisp when scaled up */
    }

    .kiosk-qr-fallback {
      display: none;
      font-size: clamp(14px, 1.9vh, 20px);
      color: var(--k-muted);
      padding: 0 12px;
    }

    .kiosk-code.qr-failed .kiosk-qr img { display: none; }
    .kiosk-code.qr-failed .kiosk-qr-fallback { display: block; }

    .kiosk-caption {
      font-size: clamp(15px, 2.1vh, 26px);
      color: var(--k-muted);
      line-height: 1.25;
    }

    /* --- shelf map: the kiosk's dark skin for web/js/shelfmap.js --- */
    .kiosk-shelf { display: grid; gap: clamp(6px, 1vh, 12px); }
    .kiosk-shelf-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      font-size: clamp(15px, 2.1vh, 26px);
      font-weight: 700;
    }
    .kiosk-shelf-hint { font-weight: 500; color: var(--k-muted); transition: color 0.4s ease; }
    .kiosk-shelf-hint.is-glow { color: #fbbf24; }
    body.kiosk .shelf-map {
      --sm-frame: #4a3826;
      --sm-back: var(--k-panel);
      --sm-unit: #3b4558;
      --sm-unit-edge: #5d6a82;
      --sm-text: var(--k-text);
      --sm-muted: var(--k-muted);
      --sm-glow: #fbbf24;
      --sm-glow-soft: rgba(251, 191, 36, 0.45);
    }

    /* --- footer: NFC hint + sandbox note --- */

    .kiosk-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(14px, 2vw, 30px);
    }

    .kiosk-nfc {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.4vw, 18px);
      padding: clamp(9px, 1.4vh, 16px) clamp(14px, 1.8vw, 24px);
      border: 2px dashed var(--k-line);
      border-radius: 999px;
      font-size: clamp(16px, 2.3vh, 28px);
      font-weight: 600;
    }

    .kiosk-nfc svg {
      width: clamp(22px, 3vh, 38px);
      height: clamp(22px, 3vh, 38px);
      flex: none;
      color: var(--brand, #1a56db);
    }

    .kiosk-nfc .wave { animation: kiosk-wave 2.6s ease-in-out infinite; }
    .kiosk-nfc .wave:nth-child(2) { animation-delay: 0.25s; }
    .kiosk-nfc .wave:nth-child(3) { animation-delay: 0.5s; }

    @keyframes kiosk-wave {
      0%, 100% { opacity: 0.35; }
      45%      { opacity: 1; }
    }

    .kiosk-note {
      font-size: clamp(12px, 1.7vh, 19px);
      color: var(--k-muted);
      text-align: right;
    }

    /* The exit variant shows one big code in the middle. */
    body.kiosk-exit .kiosk-codes { --kiosk-cols: 1; }
    body.kiosk-exit .kiosk-code { max-width: min(78vw, 640px); }

    @media (prefers-reduced-motion: reduce) {
      body.kiosk::before,
      .kiosk-status .lamp,
      .kiosk-code,
      .kiosk-nfc .wave { animation: none; }
    }
  </style>
</head>
<body class="kiosk">
  <main class="kiosk-shell">
    <header class="kiosk-head">
      <div>
        <div id="store-name" class="kiosk-store">SpeedMart</div>
        <div id="tagline" class="kiosk-tagline">Scan with your phone camera to shop.</div>
      </div>
      <div class="kiosk-clock">
        <div id="clock-time" class="kiosk-time">--:--</div>
        <div id="clock-date" class="kiosk-date"></div>
      </div>
    </header>

    <section id="status" class="kiosk-status is-offline" aria-live="polite">
      <span class="lamp" aria-hidden="true"></span>
      <span id="status-text">Connecting…</span>
      <span id="status-sub" class="kiosk-status-sub"></span>
    </section>

    <section id="codes" class="kiosk-codes">
      <!-- filled in by js/pages/kiosk.js: JOIN + ENTER, or the EXIT code on ?side=exit -->
    </section>

    <section class="kiosk-shelf" aria-labelledby="shelf-head">
      <div class="kiosk-shelf-head">
        <span id="shelf-head">The shelf</span>
        <span id="shelf-hint" class="kiosk-shelf-hint" aria-live="polite">Every bay has a number card on the shelf front.</span>
      </div>
      <!-- web/js/shelfmap.js draws the bays; plan_bays on /ws makes them glow (bay numbers only) -->
      <div id="shelf-map"></div>
    </section>

    <footer class="kiosk-foot">
      <div class="kiosk-nfc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <path class="wave" d="M6 8a6 6 0 0 1 0 8"></path>
          <path class="wave" d="M10 5a10 10 0 0 1 0 14"></path>
          <path class="wave" d="M14 2a14 14 0 0 1 0 20"></path>
        </svg>
        <span>Tap your phone here</span>
      </div>
      <div class="kiosk-note">Sandbox demo · no real payments · no personal data on this screen</div>
    </footer>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/shelfmap.js"></script>
  <script src="/js/pages/kiosk.js"></script>
</body>
</html>
