<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SpeedMart">
  <title>SpeedMart · Entry gate</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <header class="app-header">
      <a class="brand" href="/"><img class="brand-logo" src="/assets/logo.svg" alt="">SpeedMart</a>
      <span class="demo-badge" title="Demo store: a test card, no real money">DEMO</span>
      <span class="pill">Entry gate</span>
    </header>

    <section class="hero">
      <h1 class="page-title">Entry gate</h1>
      <p class="subtitle">Confirm it's you and the door opens. One shopper at a time.</p>
    </section>

    <!-- enter.js rewrites #icon's class ("big-icon ok" / "brand" / "bad"), so it stays a .big-icon. -->
    <section class="card notice">
      <div id="icon" class="big-icon brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 21h16"/><path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><circle cx="14.5" cy="12.5" r="0.9" fill="currentColor"/>
        </svg>
      </div>
      <h2 id="title">Loading…</h2>
      <p id="text" class="muted"></p>
      <div id="spinner" class="spinner lg" hidden></div>
      <div class="stack mt-4">
        <button id="enter-btn" class="primary block lg" type="button" hidden>Enter with Face ID</button>
        <p class="verify-note" data-verify-note></p>
        <a id="cart-link" class="button primary block" href="/store.html" hidden>Go to your cart</a>
        <a id="join-link" class="button block" href="/" hidden>New here? Join first</a>
      </div>
    </section>

    <section id="error" class="strip bad" role="alert" hidden></section>
  </main>

  <footer class="site-footer">Sandbox demo · no real payments</footer>

  <script src="/js/api.js"></script>
  <script src="/js/passkey.js"></script>
  <script src="/js/pages/enter.js"></script>
</body>
</html>
